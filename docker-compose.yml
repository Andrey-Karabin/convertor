services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles:
      - local-api
    env_file:
      - .env
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

  bot:
    build: .
    cpus: ${DOCKER_CPUS:-12}
    env_file:
      - .env
    environment:
      OMP_NUM_THREADS: ${DOCKER_CPUS:-12}
      OPENBLAS_NUM_THREADS: ${DOCKER_CPUS:-12}
      MKL_NUM_THREADS: ${DOCKER_CPUS:-12}
      NUMEXPR_NUM_THREADS: ${DOCKER_CPUS:-12}
    restart: unless-stopped
    volumes:
      - convertor-work:/tmp/convertor
      - telegram-bot-api-data:/var/lib/telegram-bot-api:ro
      - ./fonts:/usr/local/share/fonts/custom:ro

volumes:
  convertor-work:
  telegram-bot-api-data:
